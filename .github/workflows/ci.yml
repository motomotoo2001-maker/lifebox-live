name: Godot CI

on:
  push:
    branches:
      - dev/plan-01-simulation-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Run headless tests
        run: godot --headless --path . -s res://tests/test_runner.gd
